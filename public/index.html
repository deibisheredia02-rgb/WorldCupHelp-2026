<!DOCTYPE html>
<html lang="es" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
<meta name="theme-color" content="#0d0d0d" />
<meta name="description" content="WorldCupHelp 2026 — Guía bilingüe para aficionados del Mundial 2026 (USA · Canadá · México). Sedes, transporte, emergencias, derechos, dinero, clima." />
<title>WorldCupHelp 2026 — Tu guía del Mundial</title>

<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />
<link rel="apple-touch-icon" href="/img/apple-touch.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Symbols+Rounded" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          gold:    '#F5C518',
          'gold-d':'#C49A00',
          red:     '#C0392B',
          'red-d': '#8B2A20',
          dark:    '#0d0d0d',
          card:    '#1a1a1a',
          card2:   '#222222',
          'text-pri': '#F0F0F0',
          'text-sec': '#9A9A9A',
          'text-mut': '#666666'
        },
        fontFamily: {
          display: ['Syne','sans-serif'],
          body:    ['"DM Sans"','sans-serif'],
          impact:  ['"Bebas Neue"','sans-serif']
        },
        boxShadow: {
          gold:  '0 0 24px rgba(245,197,24,0.18)',
          red:   '0 0 20px rgba(192,57,43,0.20)',
          glass: '0 8px 32px rgba(0,0,0,0.45)'
        }
      }
    }
  };
</script>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

<style>
  :root {
    --gold: #F5C518;
    --gold-d: #C49A00;
    --red: #C0392B;
    --dark: #0d0d0d;
    --card: #1a1a1a;
    --card2: #222;
    --border: rgba(245,197,24,0.18);
    --text: #F0F0F0;
    --muted: #9A9A9A;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }

  * { -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--dark);
    color: var(--text);
    font-family: 'DM Sans', system-ui, sans-serif;
    overflow-x: hidden;
  }

  body { min-height: 100dvh; }

  ::selection { background: var(--gold); color: #000; }

  /* ─────── Glass panels (firma visual) ─────── */
  .glass {
    background: rgba(26,26,26,0.55);
    backdrop-filter: blur(20px) saturate(1.2);
    -webkit-backdrop-filter: blur(20px) saturate(1.2);
    border: 1px solid rgba(245,197,24,0.12);
  }
  .glass-strong {
    background: rgba(13,13,13,0.85);
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    border: 1px solid rgba(245,197,24,0.20);
  }

  /* ─────── Display heading helpers ─────── */
  .display { font-family: 'Syne', sans-serif; font-weight: 700; letter-spacing: -0.01em; }
  .impact  { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em; }
  .eyebrow {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(0.75rem, 2.5vw, 0.95rem);
    letter-spacing: 6px;
    color: var(--gold);
    text-transform: uppercase;
  }
  .title-grad {
    background: linear-gradient(135deg, #fff 0%, var(--gold) 50%, #fff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* ─────── Hero background (grid + radials + balls) ─────── */
  .hero-bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(245,197,24,0.13) 0%, transparent 70%),
      radial-gradient(ellipse 60% 40% at 80% 100%, rgba(192,57,43,0.10) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 20% 80%, rgba(26,107,58,0.10) 0%, transparent 60%),
      var(--dark);
  }
  .grid-overlay {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(245,197,24,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(245,197,24,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }
  .ball-deco {
    position: absolute; border-radius: 50%;
    border: 1px solid rgba(245,197,24,0.07);
    animation: pulseBall 8s ease-in-out infinite;
    pointer-events: none;
  }

  /* ─────── Animations ─────── */
  @keyframes pulseBall { 0%,100% { transform: scale(1); opacity: 0.5 } 50% { transform: scale(1.05); opacity: 1 } }
  @keyframes fadeIn    { from { opacity: 0 } to { opacity: 1 } }
  @keyframes fadeInUp  { from { opacity: 0; transform: translateY(16px) } to { opacity: 1; transform: translateY(0) } }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-12px) } to { opacity: 1; transform: translateY(0) } }
  @keyframes kenBurns  { 0% { transform: scale(1) translate(0,0) } 100% { transform: scale(1.12) translate(-2%, -1%) } }
  @keyframes pulseSlow { 0%,100% { opacity: 0.6 } 50% { opacity: 1 } }
  @keyframes spinSlow  { to { transform: rotate(360deg) } }

  .anim-fade-in    { animation: fadeIn 0.5s ease-out both; }
  .anim-fade-up    { animation: fadeInUp 0.6s cubic-bezier(.2,.8,.2,1) both; }
  .anim-slide-down { animation: slideDown 0.7s ease-out both; }
  .anim-ken-burns  { animation: kenBurns 22s ease-in-out infinite alternate; }
  .anim-pulse-slow { animation: pulseSlow 3s ease-in-out infinite; }

  .stagger > * { animation: fadeInUp 0.6s cubic-bezier(.2,.8,.2,1) both; }
  .stagger > *:nth-child(1) { animation-delay: 0.05s; }
  .stagger > *:nth-child(2) { animation-delay: 0.13s; }
  .stagger > *:nth-child(3) { animation-delay: 0.21s; }
  .stagger > *:nth-child(4) { animation-delay: 0.29s; }
  .stagger > *:nth-child(5) { animation-delay: 0.37s; }
  .stagger > *:nth-child(6) { animation-delay: 0.45s; }
  .stagger > *:nth-child(7) { animation-delay: 0.53s; }
  .stagger > *:nth-child(8) { animation-delay: 0.61s; }

  /* ─────── 3D Carousel (puerto del Prompt 2i) ─────── */
  .carousel-3d {
    perspective: 1200px;
    -webkit-perspective: 1200px;
    transform-style: preserve-3d;
  }
  .carousel-3d-card {
    transition: transform 500ms cubic-bezier(.2,.8,.2,1),
                opacity 500ms ease,
                filter 500ms ease;
    will-change: transform, opacity, filter;
  }

  /* ─────── Pill / Chip ─────── */
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 999px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.78rem; letter-spacing: 2px;
    background: rgba(245,197,24,0.08);
    border: 1px solid rgba(245,197,24,0.30);
    color: var(--gold); white-space: nowrap;
  }

  /* ─────── Buttons ─────── */
  .btn-gold {
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-d) 100%);
    color: #000;
    font-family: 'Syne', sans-serif; font-weight: 700;
    padding: 14px 26px; border-radius: 999px;
    min-height: 52px;
    box-shadow: 0 6px 24px rgba(245,197,24,0.28);
    transition: transform 200ms ease, box-shadow 200ms ease;
  }
  .btn-gold:active { transform: scale(0.97); }
  .btn-ghost {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(245,197,24,0.30);
    color: var(--text);
    font-family: 'DM Sans', sans-serif; font-weight: 500;
    padding: 14px 26px; border-radius: 999px;
    min-height: 52px;
    backdrop-filter: blur(12px);
  }

  /* ─────── Bottom Nav (mobile) ─────── */
  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0;
    z-index: 90;
    padding-bottom: var(--safe-bottom);
    background: rgba(13,13,13,0.92);
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    border-top: 1px solid var(--border);
  }
  .bottom-nav-item {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 60px; gap: 2px;
    color: var(--muted);
    transition: color 200ms ease;
  }
  .bottom-nav-item.active { color: var(--gold); }
  .bottom-nav-item .ms-icon { font-size: 26px; }
  .bottom-nav-item span { font-size: 10px; font-weight: 500; letter-spacing: 0.5px; }

  /* ─────── Material Symbols ─────── */
  .ms-icon {
    font-family: 'Material Symbols Rounded';
    font-weight: normal; font-style: normal;
    line-height: 1; letter-spacing: normal;
    text-transform: none; display: inline-block;
    white-space: nowrap; word-wrap: normal;
    direction: ltr; -webkit-font-feature-settings: 'liga';
    font-feature-settings: 'liga';
    -webkit-font-smoothing: antialiased;
    font-variation-settings:
      'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
  .ms-icon.filled { font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24; }

  /* ─────── Dot indicator (carousel) ─────── */
  .dot {
    width: 8px; height: 8px; border-radius: 999px;
    background: rgba(255,255,255,0.20);
    transition: width 280ms ease, background 280ms ease;
  }
  .dot.active {
    width: 28px;
    background: var(--gold);
  }

  /* ─────── Country chip flags ─────── */
  .flag-chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 999px;
    font-size: 0.7rem; font-weight: 600;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.10);
  }
  .flag-chip[data-country="US"] { color: #6BAAFF; border-color: rgba(107,170,255,0.30); }
  .flag-chip[data-country="MX"] { color: #1ABE5C; border-color: rgba(26,190,92,0.30); }
  .flag-chip[data-country="CA"] { color: #FF6B6B; border-color: rgba(255,107,107,0.30); }

  /* ─────── Loading spinner ─────── */
  .spinner {
    width: 20px; height: 20px; border-radius: 999px;
    border: 2px solid rgba(245,197,24,0.20);
    border-top-color: var(--gold);
    animation: spinSlow 0.8s linear infinite;
  }

  /* ─────── Scrollbar (subtle) ─────── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(245,197,24,0.20); border-radius: 999px; }

  /* ─────── Mobile-first scroll snap city carousel ─────── */
  .snap-x-strict {
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .snap-x-strict::-webkit-scrollbar { display: none; }
  .snap-x-strict > * { scroll-snap-align: center; }

  /* ─────── Reduced motion ─────── */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    .anim-ken-burns { animation: none !important; }
  }

  /* ─────── No-JS fallback ─────── */
  .nojs-fallback { display: none; }
  html:not(.js-ready) #app::before {
    content: '⚽ Cargando WorldCupHelp 2026...';
    display: flex; align-items: center; justify-content: center;
    min-height: 100dvh;
    font-family: 'Syne', sans-serif; font-size: 1.1rem;
    color: var(--gold);
  }
</style>
</head>
<body>

<noscript>
  <div style="padding:2rem;text-align:center;color:#F5C518;font-family:'Syne',sans-serif;">
    <h1>⚽ WorldCupHelp 2026</h1>
    <p style="margin-top:1rem;color:#fff">Esta aplicación necesita JavaScript activado.</p>
    <p style="margin-top:0.5rem;color:#9A9A9A">This app requires JavaScript to be enabled.</p>
  </div>
</noscript>

<div id="app"></div>

<script type="module" src="/app.js"></script>
<script>
  // Register service worker (PWA offline)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
  // Mark JS ready (for fallback CSS)
  document.documentElement.classList.add('js-ready');
</script>

</body>
</html>
